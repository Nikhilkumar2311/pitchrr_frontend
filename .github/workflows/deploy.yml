# =============================================================================
# Pitchrr Client — Build & Deploy Frontend to EC2
# =============================================================================
# Place this file in your client repo: .github/workflows/deploy.yml
#
# Required GitHub Secrets:
#   EC2_SSH_KEY             — Private key (.pem) for SSH into EC2
#   EC2_HOST                — EC2 Elastic IP address
#   VITE_RAZORPAY_KEY_ID    — Razorpay live key
# =============================================================================

name: Build and Deploy Client

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsucGl0Y2hyci5pbiQ
          VITE_CORE_API_URL: https://api.pitchrr.in/api/v1
          VITE_WEB3FORMS_ACCESS_KEY: 96031dea-feec-46b7-acea-cf3e26287d74
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}

      - name: Deploy to EC2
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

          rsync -avz --delete \
            dist/ \
            ubuntu@${{ secrets.EC2_HOST }}:/opt/pitchrr/client/dist/

      - name: Reload Nginx
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} "docker exec pitchrr-nginx nginx -s reload"
          echo "✅ Client deployed & Nginx reloaded!"
